<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="어디야?">
<meta name="theme-color" content="#4B5BFF">
<title>어디야? · 친구 시간표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6FF; --panel:#FFFFFF; --ink:#1A1F36; --muted:#6B7390; --line:#E4E8F6; --soft:#F7F9FF;
  --accent:#4B5BFF; --accent-ink:#FFFFFF; --sun:#FFC83D; --free:#0FA878; --busy:#F0474E;
  --shadow:0 6px 20px rgba(60,72,160,.08); --on-status:#FFFFFF; color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1328; --panel:#182042; --ink:#F1F3FF; --muted:#A3ABCC; --line:#27305C; --soft:#131A36;
    --accent:#7C8BFF; --accent-ink:#0E1328; --sun:#FFD54F; --free:#3BE0AE; --busy:#FF6B70;
    --shadow:0 6px 20px rgba(0,0,0,.25); --on-status:#0E1328; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1328; --panel:#182042; --ink:#F1F3FF; --muted:#A3ABCC; --line:#27305C; --soft:#131A36;
  --accent:#7C8BFF; --accent-ink:#0E1328; --sun:#FFD54F; --free:#3BE0AE; --busy:#FF6B70;
  --shadow:0 6px 20px rgba(0,0,0,.25); --on-status:#0E1328; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.55;
  min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:900px;margin:0 auto;padding:22px 16px 60px}

header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
.brand{font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:46px;line-height:1;margin:0;display:flex;align-items:center;gap:10px}
.brand .pin{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--sun);font-size:28px;transform:rotate(-8deg);box-shadow:var(--shadow)}
.brand small{display:block;font-family:"IBM Plex Sans KR",sans-serif;font-size:13.5px;color:var(--muted);margin-top:6px}
.clock{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--panel);border-radius:18px;padding:7px;box-shadow:var(--shadow)}
.clock select,.clock input{border:none;background:var(--soft);border-radius:12px;padding:7px 10px}
.clock .live{font-size:14px;padding:7px 14px;border-radius:12px;border:none;background:var(--soft);font-weight:500}
.clock .live.on{background:var(--accent);color:var(--accent-ink);font-weight:700}

nav.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto;background:var(--panel);border-radius:18px;padding:5px;box-shadow:var(--shadow)}
nav.tabs button{flex:1;border:none;background:transparent;padding:10px 12px;border-radius:14px;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}

.panel{background:var(--panel);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.hint{color:var(--muted);font-size:14px;margin:0 0 12px}

/* now board */
.board{display:grid}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--fc);color:#fff;display:grid;place-items:center;
  font-weight:700;font-size:17px}
.who{font-weight:500;font-size:13.5px;color:var(--muted)}
.where{font-weight:700;font-size:19px;line-height:1.3}
.sub{color:var(--muted);font-size:13.5px}
.badge{font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap}
.badge.free{color:var(--on-status);background:var(--free)}
.badge.busy{color:var(--on-status);background:var(--busy)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:none;background:color-mix(in srgb,var(--fc) 16%,var(--panel));border-radius:999px;padding:6px 13px 6px 9px;font-size:14px;font-weight:500}
.chip[aria-pressed="false"]{background:var(--soft);opacity:.5}
.chip .dot{width:10px;height:10px;background:var(--fc)}

/* grid */
.gridscroll{overflow-x:auto}
.grid{display:grid;position:relative}
.weekv{min-width:0}
.gh{font-size:13px;font-weight:700;text-align:center;padding:6px 0 8px}
.gh.today span{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 10px}
.tcol{position:relative}
.tcol span{position:absolute;right:6px;font-size:11px;color:var(--muted);transform:translateY(-50%)}
.dcol{position:relative;background:var(--soft);border-radius:12px;margin:0 2px}
.hline{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.blk{position:absolute;border:none;border-radius:8px;padding:4px 6px;font-size:11px;line-height:1.25;overflow:hidden;color:#fff;background:var(--fc);text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:1px;cursor:pointer}
.weekv .blk{padding:3px 4px}
.weekv .blk b{font-size:10.5px;font-weight:700;width:100%}
.weekv .blk .w{display:block;white-space:nowrap;overflow:hidden;text-overflow:clip}
.weekv .blk.narrow{padding:3px 2px}
.weekv .blk.narrow b{font-size:9px;letter-spacing:-.2px}
.dayv .blk{padding:6px 9px}
.dayv .blk b{font-size:14px}
.dayv .blk span{font-size:12px;opacity:.92}
.dayv .blk .bwho{font-weight:700;opacity:1;margin-top:auto}
.gtop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gtop .chips{margin-bottom:10px}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{border:none;background:transparent;border-radius:9px;padding:5px 12px;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.daytabs{display:flex;gap:4px;margin-bottom:12px}
.daytabs button{flex:1;border:none;background:var(--soft);border-radius:12px;padding:8px 0;font-weight:500;position:relative}
.daytabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.daytabs i{position:absolute;top:5px;right:calc(50% - 14px);width:5px;height:5px;border-radius:50%;background:var(--busy)}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(10,14,30,.45);display:flex;align-items:flex-end;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
#sheet[hidden]{display:none}
.sheet-card{background:var(--panel);width:100%;max-width:440px;border-radius:22px;padding:18px;box-shadow:var(--shadow);border-top:5px solid var(--fc)}
.sheet-who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.sheet-who .dot{background:var(--fc)}
.sheet-title{font-size:22px;font-weight:700;margin:4px 0 8px}
.sheet-title small{font-size:13px;color:var(--muted);font-weight:500}
.sheet-row{font-size:15px;margin:3px 0}
.blk.off{background:transparent;color:var(--ink);border:1.5px dashed color-mix(in srgb,var(--fc) 70%,transparent);opacity:.75}
.blk.off b{text-decoration:line-through}
.offrow td{opacity:.5}
.offrow td:last-child{opacity:1}
.sheet-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sheet-acts .btn{flex:1}
.offnote{color:var(--muted)}
.clist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.crow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:var(--soft);border-radius:14px;padding:10px 12px}
.crow-main{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 4px}
.crow-sub{flex-basis:100%;font-size:13px}
.crow-e{font-size:13px;color:var(--accent);font-weight:700;flex:none}
.crow.offrow{opacity:.55}
.crow.offrow b{text-decoration:line-through}
.tag{font-size:11.5px;background:var(--line);border-radius:6px;padding:0 6px;color:var(--muted)}
.addcls{margin-top:4px;align-self:flex-start}
.ced{background:var(--soft);border:1.5px solid var(--accent);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ced input,.ced select{border:none;background:var(--panel);border-radius:10px;padding:9px 10px;min-width:0}
.ce-row{display:flex;gap:6px;align-items:center}
.ce-row .ce-course{flex:1}
.ce-row input[type=time]{flex:1}
.ce-days{display:flex;gap:4px}
.dchip{flex:1;border:none;background:var(--panel);border-radius:10px;padding:8px 0;font-weight:500;color:var(--muted)}
.dchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.fsync{padding:0 14px 10px;font-size:12.5px}
.ce-rec{display:flex;flex-direction:column;gap:6px}
.ce-lbl{font-size:13px;font-weight:700;color:var(--muted);margin-top:4px}
.ce-rec .seg{margin-bottom:0;background:var(--panel);flex-wrap:wrap}
.ce-rec .seg button{padding:6px 10px}
.rep-b,.rep-s{display:none}
.ced[data-rep="b"] .rep-b,.ced[data-rep="s"] .rep-s{display:block}
.wchips{display:flex;flex-wrap:wrap;gap:4px}
.wchip{flex:0 0 calc(20% - 4px);font-size:12.5px;padding:7px 0}
.wchip.now{outline:1.5px solid var(--accent);outline-offset:-1.5px}
.weeknav{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.weeknav>span{flex:1;text-align:center}
.weeknav button{border:none;background:var(--soft);border-radius:10px;width:36px;height:32px;font-size:20px;line-height:1}
.weeknav .wk0{width:auto;padding:0 10px;font-size:13px}
.daytabs small,.gh small{display:block;font-size:10.5px;font-weight:400;opacity:.75}
.ver{text-align:center;margin:18px 0 0;font-size:12px}
#sync-msg .copybox{width:100%;min-height:60px;font-size:12.5px;margin:6px 0}
#refreshBtn{font-size:17px;padding:5px 11px}
#refreshBtn.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;max-width:calc(100% - 32px);transition:.25s;z-index:40;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.linkbtn{padding:0 4px;font-size:12.5px}
.linkbtn{border:none;background:none;color:var(--muted);text-decoration:underline;font-size:14px;padding:8px 4px}
details.backup summary{cursor:pointer;font-weight:700;list-style:none}
details.backup summary::after{content:" ▾";color:var(--muted)}
details.backup[open] summary{margin-bottom:8px}
.nowline{position:absolute;left:-2px;right:-2px;border-top:2.5px solid var(--busy);z-index:3}
.nowline::before{content:"";position:absolute;left:-4px;top:-6px;width:9px;height:9px;border-radius:50%;background:var(--busy)}

/* free */
.day{padding:12px 0;border-bottom:1px dashed var(--line)}
.day:last-child{border-bottom:none}
.day h3{margin:0 0 8px;font-size:16px}
.slot{display:inline-block;margin:0 6px 6px 0;padding:7px 12px;border-radius:12px;background:color-mix(in srgb,var(--free) 16%,var(--panel));color:var(--free);font-weight:700;font-size:14px}
.slot i{font-style:normal;font-weight:400;opacity:.85;margin-left:4px}
.none{color:var(--muted);font-size:14px}

/* manage */
.friend{background:var(--panel);border-radius:18px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.fhead{display:flex;align-items:center;gap:10px;padding:10px 12px}
.fhead input[type=text]{flex:1;min-width:0;border:1px solid transparent;background:transparent;font-weight:700;font-size:17px;padding:4px 6px;border-radius:10px}
.fhead input[type=text]:hover,.fhead input[type=text]:focus{border-color:var(--line);background:var(--soft)}
.fhead input[type=color]{width:24px;height:24px;border:none;padding:0;background:none;border-radius:50%;overflow:hidden;-webkit-appearance:none;appearance:none;cursor:pointer;flex:none}
.fhead input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.fhead input[type=color]::-webkit-color-swatch{border:none;border-radius:50%}
.fhead input[type=color]::-moz-color-swatch{border:none;border-radius:50%}
.fbody{padding:4px 14px 14px}
textarea{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:14px;background:var(--soft);padding:10px;font-size:13.5px;resize:vertical}
.btn{border:none;background:var(--soft);border-radius:12px;padding:9px 15px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.sunny{background:var(--sun);color:#1A1F36;font-weight:700}
.btn.danger{color:var(--busy)}
.btn.armed{background:var(--busy);color:#fff;font-weight:700}
.btn.small{padding:5px 11px;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;white-space:nowrap;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500;font-size:12.5px}
.tablewrap{overflow-x:auto}
.manual{display:grid;grid-template-columns:1.2fr 1fr .8fr .8fr 1fr auto;gap:6px;margin-top:10px}
.manual input{border:none;background:var(--soft);border-radius:10px;padding:7px 9px;min-width:0}
.backup{margin-top:18px}
h2.sec{font-size:17px;font-weight:700;margin:22px 4px 10px;color:var(--muted)}
h2.sec:first-child{margin-top:4px}
.field{flex:1;min-width:160px;border:none;background:var(--soft);border-radius:12px;padding:9px 12px}
.mebadge{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 7px;font-size:12px}
.sharebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:0 14px 12px}
.addbox{margin-bottom:12px}
.invite{text-align:center;margin-bottom:14px;border:2px solid var(--accent)}
.invite .big{font-size:40px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.backup h2{font-size:17px;margin:0 0 4px}
@media (max-width:640px){
  .manual{grid-template-columns:1fr 1fr}
  .brand{font-size:38px}.brand .pin{width:44px;height:44px;font-size:24px}
  .where{font-size:23px}
  .avatar{width:40px;height:40px;font-size:19px}
  nav.tabs button{padding:9px 8px;font-size:14px}
}
label.btn.photo{display:inline-block;cursor:pointer}
.msg{font-size:13.5px;margin:6px 0 0}
.msg.ok{color:var(--free)} .msg.err{color:var(--busy)}
.empty{text-align:center;padding:34px 12px}
.empty .big{font-size:44px}
.empty p{color:var(--muted)}
details.help summary{cursor:pointer;color:var(--muted);font-size:13.5px}
details.help pre{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:10px;font-size:12.5px;overflow-x:auto}
@media (prefers-reduced-motion:no-preference){
  .row,.slot{animation:pop .2s ease-out both}
  @keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand"><span class="pin" aria-hidden="true">📍</span><span>어디야?<small>친구가 지금 어디 있는지, 언제 비는지</small></span></h1>
    <div class="clock" aria-label="기준 시간">
      <select id="daySel" aria-label="요일"></select>
      <input id="timeSel" type="time" aria-label="시간">
      <button id="liveBtn" class="live on" type="button">지금</button>
      <button id="refreshBtn" class="live" type="button" aria-label="새로고침" title="새로고침">⟳</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="now" aria-selected="true">지금 어디?</button>
    <button role="tab" data-tab="grid" aria-selected="false">시간표</button>
    <button role="tab" data-tab="free" aria-selected="false">같이 비는 시간</button>
    <button role="tab" data-tab="manage" aria-selected="false">친구 관리</button>
  </nav>

  <main id="view"></main>
  <div id="sheet" hidden></div>
</div>

<script>
const APP_VER='0923-8';
const DAYS=['월','화','수','목','금','토','일'];
const PALETTE=['#4B5BFF','#FF7A45','#12B886','#B45CFF','#F5A300','#FF4D8D','#1CB5E0','#6FAE12'];
const START=8*60, END=22*60, MIN_FREE=30;

let state={friends:[]};
let tab='now', live=true, sel=null, openId=null, pending=null, pendingErr=null;
const meOf=()=>state.friends.find(f=>f.isMe);
const others=()=>state.friends.filter(f=>!f.isMe);
const dn=f=>f.nick||f.name;
const label=f=>f.isMe?'나':dn(f);

function load(){try{const s=localStorage.getItem('eodiya');if(s)state=JSON.parse(s)}catch(e){} if(!state||!Array.isArray(state.friends))state={friends:[]}
  if(fixMe()) try{localStorage.setItem('eodiya',JSON.stringify(state))}catch(e){}}
/* keep exactly one "me": prefer the synced one, drop copies of the same person */
function fixMe(){
  const mes=state.friends.filter(f=>f.isMe); if(mes.length<2) return false;
  const score=f=>(f.code&&f.secret?1000:0)+(f.code?100:0)+f.classes.length;
  const main=mes.slice().sort((a,b)=>score(b)-score(a))[0];
  const same=(a,b)=>(a.uid&&a.uid===b.uid)||(a.code&&a.code===b.code)||a.name===b.name||
    JSON.stringify(a.classes.map(c=>[c.course,c.days,c.start]))===JSON.stringify(b.classes.map(c=>[c.course,c.days,c.start]));
  state.friends=state.friends.filter(f=>!f.isMe||f===main||!same(f,main));
  state.friends.forEach(f=>{if(f.isMe&&f!==main)f.isMe=false});
  state.friends=[main,...state.friends.filter(f=>f!==main)];
  return true;
}
function save(){try{localStorage.setItem('eodiya',JSON.stringify(state))}catch(e){} if(typeof schedulePublish==='function') schedulePublish()}
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function dur(m){const h=Math.floor(m/60),r=m%60;return (h?h+'시간':'')+(h&&r?' ':'')+(r?r+'분':'')}

/* ---------- time reference ---------- */
function nowRef(){const d=new Date();return{day:(d.getDay()+6)%7,min:d.getHours()*60+d.getMinutes()}}
function ref(){
  if(live) return nowRef();
  const [h,m]=(document.getElementById('timeSel').value||'12:00').split(':').map(Number);
  return{day:+document.getElementById('daySel').value,min:h*60+m};
}
function syncClock(){
  if(!live) return;
  const r=nowRef();
  document.getElementById('daySel').value=r.day;
  document.getElementById('timeSel').value=fmt(r.min);
}

/* ---------- parsing ---------- */
const DAY_KO={'월':0,'화':1,'수':2,'목':3,'금':4,'토':5,'일':6};
const DAY_EN={M:0,T:1,W:2,Th:3,R:3,F:4,Sa:5,Su:6};
function parseDays(s){
  const out=new Set();
  if(/[월화수목금토일]/.test(s)){for(const ch of s) if(ch in DAY_KO) out.add(DAY_KO[ch])}
  else (s.match(/Th|Sa|Su|M|T|W|F|R/g)||[]).forEach(t=>out.add(DAY_EN[t]));
  return [...out].sort((a,b)=>a-b);
}
function parseTime(s){

function parseTimetable(text){

  const dtRe=/(?<![A-Za-z])((?:Th|Sa|Su|M|T|W|F|R)+|[월화수목금토일]+)[\s,|/]*(\d{1,2}:\d{2}\s*(?:[AaPp][Mm])?)\s*[-–~]\s*(\d{1,2}:\d{2}\s*(?:[AaPp][Mm])?)/;
  for(const raw of text.split(/\r?\n/)){
    const line=raw.trim(); if(!line) continue;
    const cm=line.match(courseRe);
    const isCourse=cm&&!COMP.test(cm[1]);
    const dm=line.match(dtRe);
    if(isCourse) course=cm[1]+' '+cm[2];
    if(!dm) continue;
    if(line.includes('|')){const first=line.split('|')[0].trim();if(first&&!dtRe.test(first))course=first.replace(/\s+(LEC|TUT|LAB)$/,'')}

    if(!days.length||st==null||en==null||en<=st) continue;

}

function statusOf(f,r){
  const today=activeOn(f,r.day);
  const cur=today.find(c=>c.start<=r.min&&r.min<c.end);
  const next=today.find(c=>c.start>=(cur?cur.end:r.min));
  if(cur){
    // chain back-to-back classes
    let freeAt=cur.end;
    for(const c of today){if(c.start<=freeAt+10&&c.end>freeAt&&c.start>=cur.start)freeAt=Math.max(freeAt,c.end)}
    return{busy:true,cur,freeAt,next};

  return{busy:false,next,freeUntil:later.length?later[0].start:null,done:!later.length&&today.length>0,noclass:today.length===0};
}

let gridMode=null, gridDay=null, blkInfo=[];
function layoutDay(items){
  items.sort((a,b)=>a.s-b.s||b.e-a.e);
  let group=[],lanes=[],gEnd=-1;
  const flush=()=>{group.forEach(it=>it.n=lanes.length);group=[];lanes=[];gEnd=-1};
  items.forEach(it=>{
    if(group.length&&it.s>=gEnd) flush();
    let li=lanes.findIndex(e=>e<=it.s); if(li<0){li=lanes.length;lanes.push(0)}
    lanes[li]=it.e;it.lane=li;group.push(it);gEnd=Math.max(gEnd,it.e);
  });
  flush();return items;
}

function cleanOCR(t){
  return t
    .replace(/(\d)[Oo]/g,'$10').replace(/[Oo](\d)/g,'0$1')
    .replace(/(\d)[lI|](?=\d|:)/g,'$11').replace(/(?<=[\d:])[lI](\d)/g,'1$1')
    .replace(/(\d)\s*[;.]\s*(\d{2})\s*(?=[AaPp][Mm]|\s|-|–|$)/g,'$1:$2')
    .replace(/(\d)\s+([AaPp])\s?[Mm]\b/g,'$1$2M')
    .replace(/[—–]/g,'-');
}
/* grid screenshot → per-day columns */
const TIME_TOK=/(\d{1,2})[:;.](\d{2})\s*([AaPp])?[MmNnHh]?(?![a-z])/g;
const DAY_LET=['M','T','W','Th','F','Sa','Su'];
function toMin(m){let h=+m[1],mi=+m[2];const ap=(m[3]||'').toUpperCase();
  if(ap==='P'&&h<12)h+=12; if(ap==='A'&&h===12)h=0; if(!ap&&h<8)h+=12; return h*60+mi}
function fmtAP(m){let h=Math.floor(m/60),ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+String(m%60).padStart(2,'0')+ap}
function parseBlocks(raw){
  const t=cleanOCR(raw).replace(/\s+/g,' ');
  const re=/\b([A-Z]{2,5}\d?)\s?(\d{3}[A-Z]?)\b(?=\s*[-–]?\s*\w{0,4}\s*[-–]?\s*(LEC|TUT|LAB|SEM|TST|PRJ|CLN|DIS|STU|WSP))/g;
  const hits=[...t.matchAll(re)];
  return hits.map((h,i)=>{
    const seg=t.slice(h.index+h[0].length,i+1<hits.length?hits[i+1].index:t.length);
    const times=[...seg.matchAll(TIME_TOK)].slice(0,2);
    if(times.length<2) return null;
    const st=toMin(times[0]),en=toMin(times[1]); if(en<=st) return null;
    const locPart=seg.slice(times[1].index+times[1][0].length);
    const b=locPart.match(/^\s*[-–]?\s*([A-Z][A-Z0-9]{1,4})\b/);
    const rooms=locPart.match(/\b\d{3,4}[A-Z]?\b/g);
    const loc=[b&&b[1],rooms&&rooms[rooms.length-1]].filter(Boolean).join(' ');
    return{course:h[1]+' '+h[2],type:h[3],start:st,end:en,loc};
  }).filter(Boolean);
}
const DAY_WORD=[/\bmon/i,/\btue/i,/\bwed/i,/\bthu/i,/\bfri/i,/\bsat/i,/\bsun/i];
function dayFromHeader(text){
  const head=text.split(/\n/).slice(0,3).join(' ');
  for(let i=0;i<7;i++) if(DAY_WORD[i].test(head)) return i;
  const ko=head.match(/[월화수목금토일]요일/); return ko?DAY_KO[ko[0][0]]:null;
}
function blocksToLines(items){
  const map=new Map();
  items.forEach(({day,c})=>{
    const k=[c.course,c.type,c.start,c.end,c.loc].join('|');
    if(!map.has(k)) map.set(k,{c,days:new Set()}); map.get(k).days.add(day);
  });
  return [...map.values()].map(({c,days})=>
    `${c.course} ${c.type} | ${[...days].sort((a,b)=>a-b).map(d=>DAY_LET[d]).join('')} | ${fmtAP(c.start)}-${fmtAP(c.end)} | ${c.loc}`);
}
async function fileToCanvas(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
    c.getContext('2d').drawImage(img,0,0);return c;
  }finally{URL.revokeObjectURL(url)}
}
function findColumns(cv){
  const W=cv.width,H=cv.height,d=cv.getContext('2d').getImageData(0,0,W,H).data;
  const step=Math.max(1,Math.floor(H/800)),cov=new Array(W).fill(0);let n=0;
  for(let y=0;y<H;y+=step){n++;
    for(let x=0;x<W;x++){const i=(y*W+x)*4,r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);
      if(mx>64&&(mx-mn)/mx>0.15)cov[x]++}}
  for(let x=0;x<W;x++)cov[x]/=n;
  const pos=cov.filter(v=>v>0.05).sort((a,b)=>a-b);
  if(!pos.length) return [];
  const th=Math.max(0.01,pos[Math.floor(pos.length/2)]*0.3),minW=Math.max(30,W/40);
  const runs=[];let st=null;
  for(let x=0;x<=W;x++){const v=x<W?cov[x]:0;
    if(v>th&&st===null)st=x;
    if(v<=th&&st!==null){if(x-st>=minW)runs.push([st,x]);st=null}}
  return runs;
}
function cropColumn(cv,a,b){
  const w=b-a,scale=w<500?2:1,c=document.createElement('canvas');
  c.width=w*scale;c.height=cv.height*scale;
  const x=c.getContext('2d');x.imageSmoothingQuality='high';
  x.drawImage(cv,a,0,w,cv.height,0,0,c.width,c.height);
  const im=x.getImageData(0,0,c.width,c.height),p=im.data;
  for(let i=0;i<p.length;i+=4){const l=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2],v=l<140?0:255;p[i]=p[i+1]=p[i+2]=v}
  x.putImageData(im,0,0);return c;
}
async function readPhoto(id,file){
  const m=document.getElementById('msg-'+id), box=document.getElementById('paste-'+id);
  const say=(t,c='')=>{m.className='msg '+c;m.textContent=t};
  let worker;
  try{
    say('글씨 인식 도구를 불러오는 중… (처음 한 번만 조금 걸려요)');
    await loadTess();
    worker=await Tesseract.createWorker('eng',1);
    await worker.setParameters({tessedit_pageseg_mode:'6'});
    const cv=await fileToCanvas(file);
    const runs=findColumns(cv);
    let lines=[],note='';
    if(runs.length>=2){
      const starts=runs.map(r=>r[0]),diffs=starts.slice(1).map((s,i)=>s-starts[i]).sort((a,b)=>a-b);
      const pitch=Math.min(...diffs)>0?diffs[0]:runs[0][1]-runs[0][0];
      const base=Math.floor(starts[0]/pitch);
      const items=[];let headerHit=false;
      for(let i=0;i<runs.length;i++){
        say(`시간표 칸 읽는 중… ${i+1}/${runs.length}`);
        const {data}=await worker.recognize(cropColumn(cv,runs[i][0],runs[i][1]));
        let day=dayFromHeader(data.text||'');
        if(day!==null) headerHit=true; else day=Math.round((runs[i][0]-starts[0])/pitch)+base;
        if(day>6) continue;
        parseBlocks(data.text||'').forEach(c=>items.push({day,c}));
      }
      lines=blocksToLines(items);
      if(!headerHit) note=' 요일은 맨 왼쪽 칸을 월요일로 봤으니 맞는지 꼭 확인하세요.';
    }
    if(!lines.length){
      say('사진 읽는 중…');
      const {data}=await worker.recognize(file);
      const text=cleanOCR(data.text||'').trim();
      lines=parseTimetable(text).length?text.split('\n'):[];
      if(!lines.length&&!text){say('사진에서 글씨를 찾지 못했어요. 더 선명한 스크린샷으로 다시 해보세요.','err');return}
      if(!lines.length){box.value=text;say('글씨는 읽었는데 수업 시간을 못 찾았어요. 아래 글씨를 “과목 | 요일 | 시작-끝 | 장소” 형식으로 고쳐 주세요.','err');return}
    }
    box.value=(box.value.trim()?box.value.trim()+'\n':'')+lines.join('\n');
    say(`수업 ${lines.length}줄을 찾았어요. 아래 내용을 확인하고 틀린 곳을 고친 다음 "시간표 읽기"를 누르세요.${note}`,'ok');
    box.focus();
  }catch(err){
    console.error(err);
    say('글씨 인식 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.','err');
  }finally{ if(worker) worker.terminate().catch(()=>{}) }
}

    const name=(document.getElementById('me-name').value||'').trim()||'나';
    const me={id:uid(),uid:uid(),isMe:true,name,color:PALETTE[0],classes:[]};
    state.friends.unshift(me);openId=me.id;sel&&sel.add(me.id);save();render();return;
  }
  if(d.act==='share'){
    const me=meOf(),synced=me.code&&me.pubKey===pubKeyOf(me);
    const link=synced?location.origin+location.pathname+'#c='+me.code:(shareCache.key===packV2(me)?shareCache.link:await shareLink());
    const text=`${me.name}의 시간표 📍\n${link}`;
    const m=document.getElementById('share-msg');
    const copied=()=>{m.textContent='공유 메시지를 복사했어요. 카톡에 붙여넣어 보내세요.'};
    if(navigator.share){navigator.share({title:'어디야? 시간표',text}).catch(()=>{});return}
    const manual=()=>{m.innerHTML=`<textarea readonly class="copybox">${esc(text)}</textarea><br>위 내용을 길게 눌러 복사해서 보내세요.`;const tb=m.querySelector('textarea');tb.focus();tb.select()};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(copied,manual);
    else manual();
    return;
  }
  if(d.act==='addCode'){
    const m=document.getElementById('add-msg');
    let p=null;try{p=await personFromText(document.getElementById('add-box').value)}catch(e){}
    if(!p){m.className='msg err';m.textContent='공유 링크를 찾지 못했어요. 친구가 보낸 메시지를 링크까지 통째로 붙여넣어 주세요. 인터넷 연결도 확인해 주세요.';return}
    const r=addPerson(p);render();
    const m2=document.getElementById('add-msg');m2.className='msg '+(r.kind==='me'?'err':'ok');
    m2.textContent=r.kind==='me'?'이건 내 시간표 링크예요.':r.kind==='updated'?`${r.f.name}의 시간표를 새로 바꿨어요.`:`${r.f.name}을(를) 친구로 추가했어요!`;
    return;
  }
  if(d.act==='pendYes'){const r=addPerson(pending);pending=null;tab='now';render();if(r.kind==='me')return;return}
  if(d.act==='pendNo'){pending=null;pendingErr=null;render();return}
  if(d.act==='pendRetry'){const h=pendingErr&&pendingErr.h;pendingErr=null;if(h){history.replaceState(null,'',location.pathname+location.search+h);checkHash()}return}
  if(d.act==='export'){
    const code=bkCache||await exportCode(),box=document.getElementById('bk-box'),m=document.getElementById('bk-msg');
    box.value=code;
    const done=()=>{m.className='msg ok';m.textContent='백업 코드를 복사했어요. 메모장이나 카톡에 붙여넣어 두세요.'};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done,()=>{box.select();m.className='msg ok';m.textContent='아래 코드를 길게 눌러 복사하세요.'});
    else{box.select();m.className='msg ok';m.textContent='아래 코드를 길게 눌러 복사하세요.'}
    return;
  }
  if(d.act==='importMerge'||d.act==='importReplace'){
    const m=document.getElementById('bk-msg');
    try{
      if(d.act==='importReplace'&&!armed2(t,'imp','한 번 더 누르면 바꿔요')) return;
      m.className='msg';m.textContent='불러오는 중…';
      let got=await importCode(document.getElementById('bk-box').value);
      if(d.act==='importMerge'){ // skip duplicates and a second "me"
        const have=state.friends;got=got.filter(p=>!have.some(f=>(p.code&&f.code===p.code)||(p.uid&&f.uid===p.uid)));
        if(meOf()) got.forEach(p=>{if(p.isMe)p.isMe=false});
      }
      state.friends=d.act==='importReplace'?got:state.friends.concat(got);
      sel=null;save();render();
      const m2=document.getElementById('bk-msg');m2.className='msg ok';m2.textContent=`${got.length}명을 불러왔어요.`;
    }catch(err){console.warn(err);m.className='msg err';m.textContent='코드를 읽지 못했어요. 코드 전체를 붙여넣었는지, 인터넷이 연결돼 있는지 확인해 주세요.'}
    return;
  }

  if(d.chip){sel.has(d.chip)?sel.delete(d.chip):sel.add(d.chip);render();return}
  if(d.toggle){editCls=null;openId=openId===d.toggle?null:d.toggle;render();return}
  if(d.parse||d.parseReplace){
    const id=d.parse||d.parseReplace, f=state.friends.find(x=>x.id===id);
    const txt=document.getElementById('paste-'+id).value;
    const got=parseTimetable(txt);
    if(!got.length){const m=document.getElementById('msg-'+id);m.className='msg err';m.textContent='수업을 하나도 찾지 못했어요. 요일과 “10:30-11:20” 같은 시간이 한 줄에 있는지 확인해 주세요.';return}
    f.classes=d.parseReplace?got:f.classes.concat(got); save(); render();
    const m=document.getElementById('msg-'+id);m.className='msg ok';m.textContent=`수업 ${got.length}개를 읽었어요.`;return;
  }
  if(d.manual){
    const id=d.manual,f=state.friends.find(x=>x.id===id),g=k=>document.getElementById(`m-${k}-${id}`).value.trim();
    const days=parseDays(g('days')),st=g('start'),en=g('end');
    const m=document.getElementById('msg-'+id);
    if(!days.length||!st||!en){m.className='msg err';m.textContent='요일, 시작, 끝 시간을 모두 입력해 주세요.';return}
    const s=parseTime(st),en2=parseTime(en);
    if(en2<=s){m.className='msg err';m.textContent='끝 시간이 시작 시간보다 늦어야 해요.';return}
    f.classes.push({id:uid(),course:g('course')||'수업',type:'',days,start:s,end:en2,loc:g('loc')});save();render();return;
  }
  if(d.delc){editCls=null;const [fid,cid]=d.delc.split(':');const f=state.friends.find(x=>x.id===fid);f.classes=f.classes.filter(c=>c.id!==cid);save();render();return}
  if(d.delf){if(!armed2(t,'del'+d.delf,'한 번 더 누르면 삭제돼요'))return;
    {const f=state.friends.find(x=>x.id===d.delf);
     if(f&&f.isMe&&f.code){const code=f.code;fbUser().then(()=>FB.db.collection('people').doc(code).delete()).catch(()=>{})}}state.friends=state.friends.filter(x=>x.id!==d.delf);sel&&sel.delete(d.delf);openId=null;save();render();watchFriends();return}
});
view.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.photo&&t.files&&t.files[0]){readPhoto(t.dataset.photo,t.files[0]);t.value='';return}
  if(t.dataset.name){const f=state.friends.find(x=>x.id===t.dataset.name),v=t.value.trim().slice(0,30);if(f.isMe||!f.code)f.name=v||f.name;else f.nick=v&&v!==f.name?v:undefined;save()}
  if(t.dataset.color){const f=state.friends.find(x=>x.id===t.dataset.color);f.color=t.value;save();render()}
});
function addFriend(){
  const f={id:uid(),name:'친구 '+(others().length+1),color:PALETTE[state.friends.length%PALETTE.length],classes:[]};
  state.friends.push(f);openId=f.id;sel&&sel.add(f.id);save();render();
  const inp=document.querySelector(`[data-name="${f.id}"]`);if(inp){inp.focus();inp.select()}
}

function toggleBlk(d){
  const key=d.skip!==undefined?d.skip:d.offb,b=blkFrom(key); if(!b) return;
  if(d.skip!==undefined){const k=dateKey(b.d,b.off);b.c.skip=b.c.skip===k?undefined:k}
  else {b.c.off=!b.c.off; if(b.c.off) b.c.skip=undefined}
  save();flushPublish();render();
  const sh=document.getElementById('sheet');sh.innerHTML=sheetHTML(key);if(!sh.innerHTML)sh.hidden=true;
}
document.getElementById('sheet').addEventListener('click',e=>{
  const sh=e.currentTarget,t=e.target.closest('button');
  if(e.target.id==='sheet'||(t&&t.dataset.act==='sheetClose')){sh.hidden=true;return}
  if(t&&(t.dataset.skip!==undefined||t.dataset.offb!==undefined)) toggleBlk(t.dataset);
});
load(); render(); checkHash(); startSync();
window.addEventListener('hashchange',()=>checkHash());
setInterval(()=>{if(live&&tab!=='manage'&&!typing())render()},30000);
</script>
</body>
