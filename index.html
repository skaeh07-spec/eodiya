<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="어디야?">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>어디야? · 친구 시간표</title>
<style>
:root{
  --bg:#F3F6FF; --panel:#FFFFFF; --ink:#1A1F36; --muted:#6B7390; --line:#E4E8F6; --soft:#F7F9FF;
  --accent:#4B5BFF; --accent-ink:#FFFFFF; --sun:#FFC83D; --free:#0FA878; --busy:#F0474E;
  --shadow:0 6px 20px rgba(60,72,160,.08); --on-status:#FFFFFF; color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1328; --panel:#182042; --ink:#F1F3FF; --muted:#A3ABCC; --line:#27305C; --soft:#131A36;
    --accent:#7C8BFF; --accent-ink:#0E1328; --sun:#FFD54F; --free:#3BE0AE; --busy:#FF6B70;
    --shadow:0 6px 20px rgba(0,0,0,.25); --on-status:#0E1328; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1328; --panel:#182042; --ink:#F1F3FF; --muted:#A3ABCC; --line:#27305C; --soft:#131A36;
  --accent:#7C8BFF; --accent-ink:#0E1328; --sun:#FFD54F; --free:#3BE0AE; --busy:#FF6B70;
  --shadow:0 6px 20px rgba(0,0,0,.25); --on-status:#0E1328; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.55;
  min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
html,body{overflow-x:clip}
#view img,#view canvas{max-width:100%}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:900px;margin:0 auto;padding:22px 16px 60px}

header.top{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-bottom:16px}
.brand{font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:46px;line-height:1;margin:0;display:flex;align-items:center;gap:10px}
.brand .pin{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--sun);font-size:28px;transform:rotate(-8deg);box-shadow:var(--shadow)}
.brand small{display:block;font-family:"IBM Plex Sans KR",sans-serif;font-size:13.5px;color:var(--muted);margin-top:6px}
.clock{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--panel);border-radius:18px;padding:7px;box-shadow:var(--shadow)}
.clock select,.clock input{border:none;background:var(--soft);border-radius:12px;padding:7px 10px}
.clock .live{font-size:14px;padding:7px 14px;border-radius:12px;border:none;background:var(--soft);font-weight:500}
.clock .live.on{background:var(--accent);color:var(--accent-ink);font-weight:700}

.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%}
.ptitle{margin:0;font-size:34px;font-weight:800;letter-spacing:-.6px;line-height:1.15}
.meav{width:42px;height:42px;border-radius:50%;border:none;padding:0;background:var(--soft);overflow:hidden;flex:none;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.meav .avatar{width:42px;height:42px;border-radius:50%;background:var(--fc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px}
.meav svg{width:24px;height:24px;fill:none;stroke:var(--muted);stroke-width:1.8}
#clockBox[hidden]{display:none}

/* ---- Liquid Glass tab bar ---- */
:root{--glass-bg:rgba(255,255,255,.52);--glass-edge:rgba(255,255,255,.75);--glass-ink:#1A1F36;--glass-muted:rgba(26,31,54,.62);--ind-bg:rgba(255,255,255,.7)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass-bg:rgba(34,40,72,.42);--glass-edge:rgba(255,255,255,.22);--glass-ink:#fff;--glass-muted:rgba(235,238,255,.66);--ind-bg:rgba(255,255,255,.16)}}
:root[data-theme="dark"]{--glass-bg:rgba(34,40,72,.42);--glass-edge:rgba(255,255,255,.22);--glass-ink:#fff;--glass-muted:rgba(235,238,255,.66);--ind-bg:rgba(255,255,255,.16)}
.tabbar{position:fixed;z-index:15;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));
  max-width:520px;margin:0 auto;height:66px;border-radius:33px;display:flex;align-items:stretch;padding:5px;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 45%),var(--glass-bg);
  -webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);
  border:1px solid var(--glass-edge);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -1px 1px rgba(255,255,255,.12),inset 0 0 0 .5px rgba(255,255,255,.08),0 12px 34px rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.12);
  touch-action:none;user-select:none;-webkit-user-select:none}
.tabbar::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 60% at 50% -20%,rgba(255,255,255,.35),transparent 60%),radial-gradient(60% 50% at 10% 120%,rgba(255,255,255,.10),transparent 70%)}
.tabbar button{position:relative;z-index:1;flex:1;min-width:0;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--glass-muted);padding:0;-webkit-tap-highlight-color:transparent;transition:color .25s}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.ticon svg{width:25px;height:25px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.tabbar button[aria-selected="true"] .ticon svg{transform:scale(1.08);stroke-width:2.1}
.tlabel{font-size:11px;font-weight:600;letter-spacing:-.1px;white-space:nowrap}
.tab-ind{position:absolute;z-index:0;top:5px;bottom:5px;left:0;width:var(--w,60px);transform:translateX(var(--x,5px));border-radius:28px;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.04)),var(--ind-bg);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 -1px 2px rgba(255,255,255,.1),0 4px 14px rgba(0,0,0,.16);
  transition:transform .42s cubic-bezier(.3,1.35,.45,1),width .42s cubic-bezier(.3,1.35,.45,1)}
.tabbar.drag button[aria-selected="true"]{color:var(--glass-muted)}
.tabbar.drag .tab-ind{transition:none;transform:translateX(var(--x)) scale(1.12,1.08)}
.tabbar.stretch .tab-ind{transition:transform .18s ease-out,width .18s ease-out}
.wrap{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px)) !important}
#toast{bottom:calc(92px + env(safe-area-inset-bottom,0px)) !important}
#view.in-r{animation:inR .32s cubic-bezier(.2,.9,.3,1)}
#view.in-l{animation:inL .32s cubic-bezier(.2,.9,.3,1)}
@keyframes inR{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.tab-ind,.ticon svg{transition:none}#view.in-r,#view.in-l{animation:none}}

.panel{background:var(--panel);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.hint{color:var(--muted);font-size:14px;margin:0 0 12px}

/* now board */
.board{display:grid}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--fc);color:#fff;display:grid;place-items:center;
  font-weight:700;font-size:17px}
.who{font-weight:500;font-size:13.5px;color:var(--muted)}
.where{font-weight:700;font-size:19px;line-height:1.3}
.sub{color:var(--muted);font-size:13.5px}
.badge{font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap}
.badge.free{color:var(--on-status);background:var(--free)}
.badge.busy{color:var(--on-status);background:var(--busy)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:none;background:color-mix(in srgb,var(--fc) 16%,var(--panel));border-radius:999px;padding:6px 13px 6px 9px;font-size:14px;font-weight:500}
.chip[aria-pressed="false"]{background:var(--soft);opacity:.5}
.chip .dot{width:10px;height:10px;background:var(--fc)}

/* grid */
.gridscroll{overflow-x:auto}
.grid{display:grid;position:relative}
.weekv{min-width:0}
.gh{font-size:13px;font-weight:700;text-align:center;padding:6px 0 8px}
.gh.today span{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 10px}
.tcol{position:relative}
.tcol span{position:absolute;right:6px;font-size:11px;color:var(--muted);transform:translateY(-50%)}
.dcol{position:relative;background:var(--soft);border-radius:12px;margin:0 2px}
.hline{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.blk{position:absolute;border:none;border-radius:8px;padding:4px 6px;font-size:11px;line-height:1.25;overflow:hidden;color:#fff;background:var(--fc);text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:1px;cursor:pointer}
.weekv .blk{padding:3px 4px}
.weekv .blk b{font-size:10.5px;font-weight:700;width:100%}
.weekv .blk .w{display:block;white-space:nowrap;overflow:hidden;text-overflow:clip}
.weekv .blk.narrow{padding:3px 2px}
.weekv .blk.narrow b{font-size:9px;letter-spacing:-.2px}
.dayv .blk{padding:6px 9px}
.dayv .blk b{font-size:14px}
.dayv .blk span{font-size:12px;opacity:.92}
.dayv .blk .bwho{font-weight:700;opacity:1;margin-top:auto}
.gtop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gtop .chips{margin-bottom:10px}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{border:none;background:transparent;border-radius:9px;padding:5px 12px;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.daytabs{display:flex;gap:4px;margin-bottom:12px}
.daytabs button{flex:1;border:none;background:var(--soft);border-radius:12px;padding:8px 0;font-weight:500;position:relative}
.daytabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.daytabs i{position:absolute;top:5px;right:calc(50% - 14px);width:5px;height:5px;border-radius:50%;background:var(--busy)}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(10,14,30,.45);display:flex;align-items:flex-end;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
#sheet[hidden]{display:none}
.sheet-card{background:var(--panel);width:100%;max-width:440px;border-radius:22px;padding:18px;box-shadow:var(--shadow);border-top:5px solid var(--fc)}
.sheet-who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.sheet-who .dot{background:var(--fc)}
.sheet-title{font-size:22px;font-weight:700;margin:4px 0 8px}
.sheet-title small{font-size:13px;color:var(--muted);font-weight:500}
.sheet-row{font-size:15px;margin:3px 0}
.blk.off{background:transparent;color:var(--ink);border:1.5px dashed color-mix(in srgb,var(--fc) 70%,transparent);opacity:.75}
.blk.off b{text-decoration:line-through}
.offrow td{opacity:.5}
.offrow td:last-child{opacity:1}
.sheet-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sheet-acts .btn{flex:1}
.offnote{color:var(--muted)}
.clist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.crow{min-width:0;max-width:100%;display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:var(--soft);border-radius:14px;padding:10px 12px}
.crow-main{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 4px}
.crow-sub{flex-basis:100%;font-size:13px}
.crow-e{font-size:13px;color:var(--accent);font-weight:700;flex:none}
.crow.offrow{opacity:.55}
.crow.offrow b{text-decoration:line-through}
.tag{font-size:11.5px;background:var(--line);border-radius:6px;padding:0 6px;color:var(--muted)}
.addcls{margin-top:4px;align-self:flex-start}
.ced{background:var(--soft);border:1.5px solid var(--accent);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ced input,.ced select{border:none;background:var(--panel);border-radius:10px;padding:9px 10px;min-width:0}
.ce-row{display:flex;gap:6px;align-items:center}
.ce-row .ce-course{flex:1}
.ce-row input[type=time]{flex:1}
.ce-days{display:flex;gap:4px}
.dchip{flex:1;border:none;background:var(--panel);border-radius:10px;padding:8px 0;font-weight:500;color:var(--muted)}
.dchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.fsync{padding:0 14px 10px;font-size:12.5px}
.ce-rec{display:flex;flex-direction:column;gap:6px}
.ce-lbl{font-size:13px;font-weight:700;color:var(--muted);margin-top:4px}
.ce-rec .seg{margin-bottom:0;background:var(--panel);flex-wrap:wrap}
.ce-rec .seg button{padding:6px 10px}
.rep-b,.rep-s{display:none}
.ced[data-rep="b"] .rep-b,.ced[data-rep="s"] .rep-s{display:block}
.wchips{display:flex;flex-wrap:wrap;gap:4px}
.wchip{flex:0 0 calc(20% - 4px);font-size:12.5px;padding:7px 0}
.wchip.now{outline:1.5px solid var(--accent);outline-offset:-1.5px}
.weeknav{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.weeknav>span{flex:1;text-align:center}
.weeknav button{border:none;background:var(--soft);border-radius:10px;width:36px;height:32px;font-size:20px;line-height:1}
.weeknav .wk0{width:auto;padding:0 10px;font-size:13px}
.daytabs small,.gh small{display:block;font-size:10.5px;font-weight:400;opacity:.75}
.ver{text-align:center;margin:18px 0 0;font-size:12px}
#sync-msg .copybox{width:100%;min-height:60px;font-size:12.5px;margin:6px 0}
#refreshBtn{font-size:17px;padding:5px 11px}
#refreshBtn.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;max-width:calc(100% - 32px);transition:.25s;z-index:40;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.acct{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}
.acct>div{flex:1;min-width:200px}
.acct .msg{flex-basis:100%;margin:0}
#netBadge{font-size:12px;font-weight:700;color:#fff;background:var(--busy);border-radius:999px;padding:3px 9px}
.install{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px;border:1.5px solid var(--accent)}
.install>div{flex:1;min-width:200px}
.expbox{margin-top:14px;background:var(--soft);border-radius:16px;padding:12px}
.expbox input[type=date]{border:none;background:var(--panel);border-radius:10px;padding:7px 9px}
.avatar{overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.sm{width:34px;height:34px;border-radius:50%;background:var(--fc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.avatar.xs{width:20px;height:20px;border-radius:50%;background:var(--fc);color:#fff;display:inline-grid;place-items:center;font-weight:700;font-size:10px}
.chip .avatar.xs{margin-left:-3px}
.avpick{position:relative;cursor:pointer;flex:none}
.avcam{position:absolute;right:-4px;bottom:-4px;font-size:11px;background:var(--panel);border-radius:50%;width:18px;height:18px;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.fold{padding:0 18px}
.fold[open]{padding-bottom:16px}
.fold>summary{list-style:none;cursor:pointer;padding:14px 18px;margin:0 -18px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:transform .2s}
.fold[open]>summary::after{transform:rotate(180deg)}
.fold>summary .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.fold .acct{margin:0}
details.fold.addbox{margin-bottom:12px}
.colorin{width:28px;height:28px;border:none;padding:0;background:none}
.profile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:22px;margin-bottom:6px}
.avbig{position:relative;cursor:pointer}
.avatar.lg{width:116px;height:116px;border-radius:50%;background:var(--fc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:44px;box-shadow:0 6px 20px rgba(0,0,0,.18);border:3px solid var(--panel);outline:3px solid var(--fc)}
.avbig .avcam{width:32px;height:32px;font-size:16px;right:0;bottom:0}
.pname{font-size:22px;font-weight:700;text-align:center;border:1px solid transparent;background:transparent;border-radius:10px;padding:4px 8px;max-width:100%;margin-top:6px}
.pname:hover,.pname:focus{border-color:var(--line);background:var(--soft)}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:4px 0}
.profile .sharebar{justify-content:center;padding:6px 0 0;width:100%}
.mebody{padding-top:2px}
.mycls{margin-top:14px}
.tip{margin-bottom:12px}
.crop-card{text-align:center}
#cropcv{width:min(300px,76vw);height:auto;aspect-ratio:1;border-radius:18px;touch-action:none;cursor:grab;background:#000;display:block;margin:6px auto 10px}
.zoomrow{justify-content:center}
.zoomrow input{flex:1;max-width:240px}
.sub-fold{background:var(--soft);border-radius:16px;margin:8px 0;padding:0 14px}
.sub-fold[open]{padding-bottom:12px}
.sub-fold>summary{padding:11px 14px;margin:0 -14px}
.sub-fold textarea{background:var(--panel)}
.sub-fold .expbox{margin:0;padding:0;background:none}
.linkbtn{padding:0 4px;font-size:12.5px}
.linkbtn{border:none;background:none;color:var(--muted);text-decoration:underline;font-size:14px;padding:8px 4px}
details.backup summary{cursor:pointer;font-weight:700;list-style:none}
details.backup[open] summary{margin-bottom:8px}
.nowline{position:absolute;left:-2px;right:-2px;border-top:2.5px solid var(--busy);z-index:3}
.nowline::before{content:"";position:absolute;left:-4px;top:-6px;width:9px;height:9px;border-radius:50%;background:var(--busy)}

/* free */
.day{padding:12px 0;border-bottom:1px dashed var(--line)}
.day:last-child{border-bottom:none}
.day h3{margin:0 0 8px;font-size:16px}
.slot{display:inline-block;margin:0 6px 6px 0;padding:7px 12px;border-radius:12px;background:color-mix(in srgb,var(--free) 16%,var(--panel));color:var(--free);font-weight:700;font-size:14px}
.slot i{font-style:normal;font-weight:400;opacity:.85;margin-left:4px}
.none{color:var(--muted);font-size:14px}

/* manage */
.friend{background:var(--panel);border-radius:18px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.fhead{display:flex;align-items:center;gap:10px;padding:10px 12px}
.fhead input[type=text]{flex:1;min-width:0;border:1px solid transparent;background:transparent;font-weight:700;font-size:17px;padding:4px 6px;border-radius:10px}
.fhead input[type=text]:hover,.fhead input[type=text]:focus{border-color:var(--line);background:var(--soft)}

/* ---------- parsing ---------- */
const DAY_KO={'월':0,'화':1,'수':2,'목':3,'금':4,'토':5,'일':6};
const DAY_EN={Mo:0,Tu:1,We:2,Th:3,Fr:4,Sa:5,Su:6,M:0,T:1,W:2,R:3,F:4};
function parseDays(s){
  const out=new Set();
  if(/[월화수목금토일]/.test(s)){for(const ch of s) if(ch in DAY_KO) out.add(DAY_KO[ch])}
  else (s.match(/Mo|Tu|We|Th|Fr|Sa|Su|M|T|W|F|R/g)||[]).forEach(t=>out.add(DAY_EN[t]));
  return [...out].sort((a,b)=>a-b);
}
function parseTime(s){
  const m=s.trim().match(/^(\d{1,2}):(\d{2})\s*([AaPp][Mm])?$/); if(!m) return null;
  let h=+m[1],mi=+m[2]; const ap=m[3]&&m[3].toUpperCase();
  if(ap==='PM'&&h<12)h+=12; if(ap==='AM'&&h===12)h=0;
  if(!ap&&h<8)h+=12; // "1:30" 같은 건 오후로 봄
  return h*60+mi;
}
const COMP=/\b(LEC|TUT|LAB|SEM|TST|PRJ|CLN|DIS|STU|WSP)\b/;
/* Quest pages copied from a phone or some browsers put every table cell on its own line.
   Rebuild one row per meeting: component + days/time + room + dates. */
function questRows(text){
  const L=text.split(/\r?\n/).map(x=>x.trim());
  const timeOnly=/^((?:Mo|Tu|We|Th|Fr|Sa|Su|M|T|W|F|R)+)\s+\d{1,2}:\d{2}\s*(?:[AaPp][Mm])?\s*-\s*\d{1,2}:\d{2}\s*(?:[AaPp][Mm])?$/;
  const roomRe=/^([A-Z]{1,5}\d?\s?\d{3,4}[A-Z]?|TBA|ONLN.*|Online.*)$/;
  const dateRe=/^\d{1,2}\/\d{1,2}\/\d{4}\s*[-–]\s*\d{1,2}\/\d{1,2}\/\d{4}$/;
  const out=[];
  for(let i=0;i<L.length;i++){
    if(!timeOnly.test(L[i])){out.push(L[i]);continue}
    let comp='';for(let j=i-1;j>=Math.max(0,i-3);j--){const m=L[j].match(COMP);if(m&&L[j].length<=4){comp=m[1];break}if(timeOnly.test(L[j]))break}
    let room='',dates='',j=i+1;
    for(;j<L.length&&j<=i+4;j++){
      if(timeOnly.test(L[j])||/\b[A-Z]{2,6}\s?\d{2,3}[A-Z]?\s*-\s*[A-Za-z]/.test(L[j]))break;
      if(!room&&roomRe.test(L[j]))room=L[j];
      else if(!dates&&dateRe.test(L[j])){dates=L[j];j++;break}
    }
    out.push([comp,L[i],room,dates].join('\t'));
    i=j-1;
  }
  return out.join('\n');
}
function parseTimetable(text){
  text=questRows(text);
  const out=[]; let course='';
  const courseRe=/\b([A-Z]{2,6})\s?(\d{2,3}[A-Z]?)\b(?=\s*-\s*[A-Za-z(])|^\s*([A-Z]{2,6})\s?(\d{2,3}[A-Z]?)\b/;
  const dtRe=/(?<![A-Za-z])((?:Mo|Tu|We|Th|Fr|Sa|Su|M|T|W|F|R)+|[월화수목금토일]+)[\s,|/]*(\d{1,2}:\d{2}\s*(?:[AaPp][Mm])?)\s*[-–~]\s*(\d{1,2}:\d{2}\s*(?:[AaPp][Mm])?)/;
  for(const raw of text.split(/\r?\n/)){
    const line=raw.trim(); if(!line) continue;
    const cm=line.match(courseRe),cs=cm&&(cm[1]||cm[3]),cn=cm&&(cm[2]||cm[4]);
    const isCourse=cm&&!COMP.test(cs)&&!/^(TBA|ONLN)$/.test(cs);
    const dm=line.match(dtRe);
    if(isCourse&&!(dm&&cm.index>dm.index)) course=cs+' '+cn;
    if(!dm) continue;
    if(line.includes('|')){const first=line.split('|')[0].trim();if(first&&!dtRe.test(first))course=first.replace(/\s+(LEC|TUT|LAB)$/,'')}
    const days=parseDays(dm[1]), st=parseTime(dm[2]), en=parseTime(dm[3]);
    if(!days.length||st==null||en==null||en<=st) continue;
    const after=line.slice(dm.index+dm[0].length);
    const room=after.match(/^[\s|,]*([A-Z]{1,5}\d?\s?\d{3,4}[A-Z]?)\b/);
    let loc=room?room[1]:((after.split(/\t|\||,|\s{2,}/).map(x=>x.trim()).filter(Boolean)[0])||'');
    if(/^tba$/i.test(loc)) loc='';
    const comp=(line.match(COMP)||[])[1]||'';
    const cls={id:uid(),course:course||'수업',type:comp,days,start:st,end:en,loc};
    const dr=line.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\s*[-–~]\s*(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(dr){
      const mk=(a,b,y)=>{a=+a;b=+b;const [mo,da]=a>12?[b,a]:[a,b];if(mo<1||mo>12||da<1||da>31)return null;return y+pad2(mo)+pad2(da)};
      const f=mk(dr[1],dr[2],dr[3]),t=mk(dr[4],dr[5],dr[6]);
      if(f&&t&&f===t){ // one day only (e.g. a test): that date's week & weekday
        const d=keyDate(f);cls.days=[(d.getDay()+6)%7];cls.rep='s';cls.weeks=[mondayKey(d)];if(/tst|exam|midterm/i.test(line))cls.type=cls.type||'TST';
      }else if(f&&t&&f<t){if(f>todayKey())cls.from=f;cls.to=t}
    }
    out.push(cls);
  }
  const merged=[];
  for(const c of out){
    const twin=merged.find(o=>o.course===c.course&&o.type===c.type&&o.start===c.start&&o.end===c.end&&o.loc===c.loc&&(o.rep||'')===(c.rep||'')&&(o.to||'')===(c.to||'')&&(c.rep!=='s'||o.days.join()===c.days.join()));
    if(!twin){merged.push(c);continue}
    if(c.rep==='s') twin.weeks=[...new Set(twin.weeks.concat(c.weeks))].sort();
    else twin.days=[...new Set(twin.days.concat(c.days))].sort((a,b)=>a-b);
  }
  return merged;
}

  const dk=dateKey(day,off),wk=dateKey(0,off);

  if(c.rep==='b'&&c.anchor) t.push('b'+k36(c.anchor));
  if(c.rep==='s'&&c.weeks&&c.weeks.length) t.push('w'+c.weeks.map(k36).join(','));

function applyFlags(c,fl){

    else if(old){if(old[1])c.off=true;c.skip=old[2]}
    else if(tk[0]==='b'){const k=from36(tk.slice(1));if(k){c.rep='b';c.anchor=k}}
    else if(tk[0]==='w'){const w=tk.slice(1).split(',').filter(Boolean).slice(0,60).map(from36).filter(Boolean);if(w.length){c.rep='s';c.weeks=w}}
    else if(tk[0]==='f'){const k=from36(tk.slice(1));if(k)c.from=k}

function statusOf(f,r){
  const today=activeOn(f,r.day);
  const cur=today.find(c=>c.start<=r.min&&r.min<c.end);
  const next=today.find(c=>c.start>=(cur?cur.end:r.min));
  if(cur){
    // chain back-to-back classes
    let freeAt=cur.end;
    for(const c of today){if(c.start<=freeAt+10&&c.end>freeAt&&c.start>=cur.start)freeAt=Math.max(freeAt,c.end)}

/* ---------- free slots ---------- */
function freeSlots(friends,day,off=0){
  const busy=friends.flatMap(f=>activeOn(f,day,off).map(c=>[c.start,c.end])).sort((a,b)=>a[0]-b[0]);
  const slots=[];let t=START;
  for(const [s,e] of busy){ if(s>t) slots.push([t,Math.min(s,END)]); t=Math.max(t,e); if(t>=END)break; }
  if(t<END) slots.push([t,END]);

}

/* ---------- OCR (Tesseract.js, runs on device) ---------- */
let tessLoading=null;
function loadTess(){
  if(window.Tesseract) return Promise.resolve();
  if(tessLoading) return tessLoading;
  tessLoading=new Promise((res,rej)=>{
    const sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    sc.onload=res; sc.onerror=()=>{tessLoading=null;rej(new Error('load'))};
    document.head.appendChild(sc);
  });
  return tessLoading;
}
function cleanOCR(t){
  return t
    .replace(/(\d)[Oo]/g,'$10').replace(/[Oo](\d)/g,'0$1')
    .replace(/(\d)[lI|](?=\d|:)/g,'$11').replace(/(?<=[\d:])[lI](\d)/g,'1$1')
    .replace(/(\d)\s*[;.]\s*(\d{2})\s*(?=[AaPp][Mm]|\s|-|–|$)/g,'$1:$2')
    .replace(/(\d)\s+([AaPp])\s?[Mm]\b/g,'$1$2M')
    .replace(/[—–]/g,'-');
}
/* grid screenshot → per-day columns */
const TIME_TOK=/(\d{1,2})[:;.](\d{2})\s*([AaPp])?[MmNnHh]?(?![a-z])/g;
const DAY_LET=['M','T','W','Th','F','Sa','Su'];
function toMin(m){let h=+m[1],mi=+m[2];const ap=(m[3]||'').toUpperCase();
  if(ap==='P'&&h<12)h+=12; if(ap==='A'&&h===12)h=0; if(!ap&&h<8)h+=12; return h*60+mi}
function fmtAP(m){let h=Math.floor(m/60),ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+String(m%60).padStart(2,'0')+ap}
function parseBlocks(raw){
  const t=cleanOCR(raw).replace(/\s+/g,' ');
  const re=/\b([A-Z]{2,5}\d?)\s?(\d{3}[A-Z]?)\b(?=\s*[-–]?\s*\w{0,4}\s*[-–]?\s*(LEC|TUT|LAB|SEM|TST|PRJ|CLN|DIS|STU|WSP))/g;
  const hits=[...t.matchAll(re)];
  return hits.map((h,i)=>{
    const seg=t.slice(h.index+h[0].length,i+1<hits.length?hits[i+1].index:t.length);
    const times=[...seg.matchAll(TIME_TOK)].slice(0,2);
    if(times.length<2) return null;
    const st=toMin(times[0]),en=toMin(times[1]); if(en<=st) return null;
    const locPart=seg.slice(times[1].index+times[1][0].length);
    const b=locPart.match(/^\s*[-–]?\s*([A-Z][A-Z0-9]{1,4})\b/);
    const rooms=locPart.match(/\b\d{3,4}[A-Z]?\b/g);
    const loc=[b&&b[1],rooms&&rooms[rooms.length-1]].filter(Boolean).join(' ');
    return{course:h[1]+' '+h[2],type:h[3],start:st,end:en,loc};
  }).filter(Boolean);
}
const DAY_WORD=[/\bmon/i,/\btue/i,/\bwed/i,/\bthu/i,/\bfri/i,/\bsat/i,/\bsun/i];
function dayFromHeader(text){

function blocksToLines(items){

async function fileToCanvas(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;

function findColumns(cv){
  const W=cv.width,H=cv.height,d=cv.getContext('2d').getImageData(0,0,W,H).data;
  const step=Math.max(1,Math.floor(H/800)),cov=new Array(W).fill(0);let n=0;
  for(let y=0;y<H;y+=step){n++;
    for(let x=0;x<W;x++){const i=(y*W+x)*4,r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);
      if(mx>64&&(mx-mn)/mx>0.15)cov[x]++}}
  for(let x=0;x<W;x++)cov[x]/=n;
  const pos=cov.filter(v=>v>0.05).sort((a,b)=>a-b);
  if(!pos.length) return [];
  const th=Math.max(0.01,pos[Math.floor(pos.length/2)]*0.3),minW=Math.max(30,W/40);
  const runs=[];let st=null;
  for(let x=0;x<=W;x++){const v=x<W?cov[x]:0;
    if(v>th&&st===null)st=x;
    if(v<=th&&st!==null){if(x-st>=minW)runs.push([st,x]);st=null}}
  return runs;
}
function cropColumn(cv,a,b){
  const w=b-a,scale=w<500?2:1,c=document.createElement('canvas');
  c.width=w*scale;c.height=cv.height*scale;
  const x=c.getContext('2d');x.imageSmoothingQuality='high';
  x.drawImage(cv,a,0,w,cv.height,0,0,c.width,c.height);
  const im=x.getImageData(0,0,c.width,c.height),p=im.data;
  for(let i=0;i<p.length;i+=4){const l=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2],v=l<140?0:255;p[i]=p[i+1]=p[i+2]=v}
  x.putImageData(im,0,0);return c;
}
async function readPhoto(id,file){
  const m=document.getElementById('msg-'+id), box=document.getElementById('paste-'+id);
  const say=(t,c='')=>{m.className='msg '+c;m.textContent=t};
  let worker;
  try{
    say('글씨 인식 도구를 불러오는 중… (처음 한 번만 조금 걸려요)');
    await loadTess();
    worker=await Tesseract.createWorker('eng',1);
    await worker.setParameters({tessedit_pageseg_mode:'6'});
    const cv=await fileToCanvas(file);
    const runs=findColumns(cv);
    let lines=[],note='';
    if(runs.length>=2){
      const starts=runs.map(r=>r[0]),diffs=starts.slice(1).map((s,i)=>s-starts[i]).sort((a,b)=>a-b);
      const pitch=Math.min(...diffs)>0?diffs[0]:runs[0][1]-runs[0][0];
      const base=Math.floor(starts[0]/pitch);
      const items=[];let headerHit=false;
      for(let i=0;i<runs.length;i++){
        say(`시간표 칸 읽는 중… ${i+1}/${runs.length}`);
        const {data}=await worker.recognize(cropColumn(cv,runs[i][0],runs[i][1]));
        let day=dayFromHeader(data.text||'');
        if(day!==null) headerHit=true; else day=Math.round((runs[i][0]-starts[0])/pitch)+base;
        if(day>6) continue;
        parseBlocks(data.text||'').forEach(c=>items.push({day,c}));
      }
      lines=blocksToLines(items);
      if(!headerHit) note=' 요일은 맨 왼쪽 칸을 월요일로 봤으니 맞는지 꼭 확인하세요.';
    }
    if(!lines.length){
      say('사진 읽는 중…');
      const {data}=await worker.recognize(file);
      const text=cleanOCR(data.text||'').trim();
      lines=parseTimetable(text).length?text.split('\n'):[];
      if(!lines.length&&!text){say('사진에서 글씨를 찾지 못했어요. 더 선명한 스크린샷으로 다시 해보세요.','err');return}
      if(!lines.length){box.value=text;say('글씨는 읽었는데 수업 시간을 못 찾았어요. 아래 글씨를 “과목 | 요일 | 시작-끝 | 장소” 형식으로 고쳐 주세요.','err');return}
    }
    box.value=(box.value.trim()?box.value.trim()+'\n':'')+lines.join('\n');
    say(`수업 ${lines.length}줄을 찾았어요. 아래 내용을 확인하고 틀린 곳을 고친 다음 "시간표 읽기"를 누르세요.${note}`,'ok');
    box.focus();
  }catch(err){
    console.error(err);
    say('글씨 인식 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.','err');
  }finally{ if(worker) worker.terminate().catch(()=>{}) }
}

const pushSupported=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;

const pmsg=(t,c='')=>{const m=document.getElementById('push-msg');if(m){m.className='msg '+c;m.textContent=t}};
async function pushSub(){const reg=await navigator.serviceWorker.ready;return reg.pushManager.getSubscription()}
async function syncPush(sub){
  if(!PUSH_URL||!pushOn()) return;
  sub=sub||await pushSub(); if(!sub) return;
  const follows=others().filter(f=>f.code).map(f=>f.code);
  const r=await fetch(PUSH_URL+'/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:state.push.id,sub:sub.toJSON(),follows})});
  if(!r.ok) throw new Error('subscribe '+r.status);
  state.push.follows=follows.join(',');localSave();
}
let pushTimer=null;
function schedulePushSync(){
  if(!pushOn()) return;
  const now=others().filter(f=>f.code).map(f=>f.code).join(',');
  if(now===state.push.follows) return;
  clearTimeout(pushTimer);pushTimer=setTimeout(()=>syncPush().catch(()=>{}),1500);
}
async function enablePush(){
  try{
    pmsg('알림 권한을 요청하는 중…');
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){pmsg('알림이 허용되지 않았어요.','err');render();return}
    const reg=await navigator.serviceWorker.ready;
    const {key}=await (await fetch(PUSH_URL+'/vapid')).json();
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:unb64uBytes(key)});
    state.push={on:true,id:(state.push&&state.push.id)||('d'+rand(20))};
    await syncPush(sub);localSave();render();toast('🔔 친구 상태 알림을 켰어요');
  }catch(e){console.warn(e);pmsg('알림을 켜지 못했어요. 인터넷 연결을 확인하고 다시 해주세요.','err')}
}
async function disablePush(){
  try{
    if(state.push&&state.push.id) await fetch(PUSH_URL+'/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:state.push.id})});
    const sub=await pushSub();if(sub)await sub.unsubscribe();
  }catch(e){}
  state.push=Object.assign(state.push||{},{on:false});localSave();render();
}
function unb64uBytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
// after I post a status: ask the server to tell my friends (it double-checks Firestore itself)
async function notifyFriends(t){
  if(!PUSH_URL) return;

    await new Promise(r=>setTimeout(r,i?3000:1500));
    const me=meOf();if(!me||!me.code) continue;
    try{const r=await fetch(PUSH_URL+'/notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:me.code,t})});if(r.status!==409)return}catch(e){}
  }
}

function cropGeom(size){

  const w=img.naturalWidth*sc,h=img.naturalHeight*sc;return{w,h,x:(size-w)/2+crop.ox*k,y:(size-h)/2+crop.oy*k};
}
function clampCrop(){const g=cropGeom(600),mx=(g.w-600)/2,my=(g.h-600)/2;crop.ox=Math.max(-mx,Math.min(mx,crop.ox));crop.oy=Math.max(-my,Math.min(my,crop.oy))}

  const cv=document.getElementById('cropcv');if(!cv||!crop)return;const x=cv.getContext('2d'),g=cropGeom(600);
  x.clearRect(0,0,600,600);x.drawImage(crop.img,g.x,g.y,g.w,g.h);
  x.fillStyle='rgba(10,14,30,.6)';x.beginPath();x.rect(0,0,600,600);x.arc(300,300,296,0,Math.PI*2,true);x.fill('evenodd');
  x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=3;x.beginPath();x.arc(300,300,296,0,Math.PI*2);x.stroke();
}
function openCropper(img){

  sh.innerHTML=`<div class="sheet-card crop-card"><div class="sheet-title">프로필 사진 조정</div>

    <p class="sub" style="margin:4px 0 0;text-align:center">사진을 끌어서 위치를, 슬라이더나 두 손가락으로 크기를 맞춰요</p>
    <div class="sheet-acts"><button class="btn" data-act="cropCancel">취소</button><button class="btn primary" data-act="cropSave">저장</button></div></div>`;
  sh.hidden=false;
  const cv=sh.querySelector('#cropcv'),zoom=sh.querySelector('#cropzoom'),pts=new Map();
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY})});

    const prev=pts.get(e.pointerId);if(!prev)return;const k=600/cv.getBoundingClientRect().width;
    if(pts.size===1){crop.ox+=(e.clientX-prev.x)*k;crop.oy+=(e.clientY-prev.y)*k}
    else{const o=[...pts].find(([id])=>id!==e.pointerId)[1],d0=Math.hypot(prev.x-o.x,prev.y-o.y),d1=Math.hypot(e.clientX-o.x,e.clientY-o.y);
      if(d0>0){crop.z=Math.min(4,Math.max(1,crop.z*d1/d0));zoom.value=crop.z}}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});clampCrop();drawCrop();
  });
  const up=e=>pts.delete(e.pointerId);cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{e.preventDefault();crop.z=Math.min(4,Math.max(1,crop.z*(e.deltaY<0?1.06:0.94)));zoom.value=crop.z;clampCrop();drawCrop()},{passive:false});

  drawCrop();
}

  if(d.act==='pushOnBtn'){enablePush();return}
  if(d.act==='pushOff'){disablePush();return}
  if(d.act==='pushTest'){(async()=>{try{const reg=await navigator.serviceWorker.ready;await reg.showNotification('어디야?',{body:'알림이 잘 와요! 🔔',icon:'icon-192.png',tag:'test'})}catch(e){pmsg('테스트 알림을 띄우지 못했어요.','err')}})();return}
  if(d.act==='cropAgain'){const me=meOf();if(!me)return;(lastCropImg?Promise.resolve(lastCropImg):loadImg(me.photo)).then(openCropper).catch(()=>{});return}
  if(d.act==='rmphoto'){const me=meOf();if(me){delete me.photo;save();flushPublish();render()}return}
  if(d.icsdl){const file=icsFile(d.icsdl),a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);const m=document.getElementById('icsmsg-'+d.icsdl);if(m){m.className='msg ok';m.textContent='파일을 만들었어요. 열면 캘린더에 추가할 수 있어요.'}return}
  if(d.icsshare){const file=icsFile(d.icsshare);if(navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file],title:file.name}).catch(()=>{});
    else{const m=document.getElementById('icsmsg-'+d.icsshare);if(m){m.className='msg err';m.textContent='이 기기에서는 공유가 안 돼서 "파일 받기"를 써주세요.'}}return}
  if(d.act==='install'&&installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render()});return}
  if(d.act==='login'){googleLogin();return}
  if(d.act==='logout'){googleLogout();return}
  if(d.act==='syncNow'){const me=meOf();if(me)me.pubKey='';setSync('saving');await publishMe();refreshFriends(true);render();return}
  if(d.setme){const f=state.friends.find(x=>x.id===d.setme);f.isMe=true;f.uid=f.uid||uid();
    state.friends=[f,...state.friends.filter(x=>x!==f)];openId=null;tab='me';save();render();return}
  if(d.cedit){editCls=d.cedit;if(meOf()&&d.cedit.startsWith(meOf().id+':')){state.ui=state.ui||{};state.ui.mycls=true}render();const el=document.querySelector(`[data-ced="${d.cedit}"]`);if(el){el.scrollIntoView({block:'center',behavior:'smooth'});const i=el.querySelector('.ce-course');if(d.cedit.endsWith(':new'))i.focus()}return}
  if(d.wk!==undefined){weekOff=d.wk==='0'?0:weekOff+(+d.wk);render();return}
  if(d.rep&&t.closest('.ced')){const box=t.closest('.ced');box.dataset.rep=d.rep;box.querySelectorAll('[data-rep]').forEach(x=>x.setAttribute('aria-pressed',x===t));return}
  if(d.anc!==undefined){t.parentElement.querySelectorAll('[data-anc]').forEach(x=>x.setAttribute('aria-pressed',x===t));return}
  if(d.wchip){t.setAttribute('aria-pressed',t.getAttribute('aria-pressed')!=='true');return}
  if(d.dchip!==undefined){t.setAttribute('aria-pressed',t.getAttribute('aria-pressed')!=='true');return}
  if(d.cesave){saveClass(d.cesave,t.closest('.ced'));return}
  if(d.cecancel){editCls=null;render();return}
  if(d.offc){const [fid,cid]=d.offc.split(':');const c=state.friends.find(x=>x.id===fid).classes.find(x=>x.id===cid);c.off=!c.off;if(c.off)c.skip=undefined;save();render();return}
  if(d.gmode){gridMode=d.gmode;render();return}
  if(d.gday!==undefined){gridDay=+d.gday;render();return}
  if(d.blk!==undefined){const sh=document.getElementById('sheet');sh.innerHTML=sheetHTML(d.blk);sh.hidden=!sh.innerHTML;return}
  if(d.act==='makeMe'){
    if(meOf()){render();return}
    const name=(document.getElementById('me-name').value||'').trim()||'나';
    const me={id:uid(),uid:uid(),isMe:true,name,color:PALETTE[0],classes:[]};
    state.friends.unshift(me);openId=me.id;sel&&sel.add(me.id);save();render();return;
  }
  if(d.act==='share'){
    const me=meOf(),synced=me.code&&me.pubKey===pubKeyOf(me);
    const link=synced?location.origin+location.pathname+'#c='+me.code:(shareCache.key===packV2(me)?shareCache.link:await shareLink());
    const text=`${me.name}의 시간표 📍\n${link}`;
    const m=document.getElementById('share-msg');
    const copied=()=>{m.textContent='공유 메시지를 복사했어요. 카톡에 붙여넣어 보내세요.'};
    if(navigator.share){navigator.share({title:'어디야? 시간표',text}).catch(()=>{});return}
    const manual=()=>{m.innerHTML=`<textarea readonly class="copybox">${esc(text)}</textarea><br>위 내용을 길게 눌러 복사해서 보내세요.`;const tb=m.querySelector('textarea');tb.focus();tb.select()};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(copied,manual);
    else manual();
    return;
  }
  if(d.act==='addCode'){
    const m=document.getElementById('add-msg');
    let p=null;try{p=await personFromText(document.getElementById('add-box').value)}catch(e){}
    if(!p){m.className='msg err';m.textContent='공유 링크를 찾지 못했어요. 친구가 보낸 메시지를 링크까지 통째로 붙여넣어 주세요. 인터넷 연결도 확인해 주세요.';return}
    const r=addPerson(p);render();
    const m2=document.getElementById('add-msg');m2.className='msg '+(r.kind==='me'?'err':'ok');
    m2.textContent=r.kind==='me'?'이건 내 시간표 링크예요.':r.kind==='updated'?`${r.f.name}의 시간표를 새로 바꿨어요.`:`${r.f.name}을(를) 친구로 추가했어요!`;
    return;
  }
  if(d.act==='pendYes'){const r=addPerson(pending);pending=null;tab='now';render();if(r.kind==='me')return;return}
  if(d.act==='pendNo'){pending=null;pendingErr=null;render();return}
  if(d.act==='pendRetry'){const h=pendingErr&&pendingErr.h;pendingErr=null;if(h){history.replaceState(null,'',location.pathname+location.search+h);checkHash()}return}
  if(d.act==='export'){
    const code=bkCache||await exportCode(),box=document.getElementById('bk-box'),m=document.getElementById('bk-msg');
    box.value=code;
    const done=()=>{m.className='msg ok';m.textContent='백업 코드를 복사했어요. 메모장이나 카톡에 붙여넣어 두세요.'};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done,()=>{box.select();m.className='msg ok';m.textContent='아래 코드를 길게 눌러 복사하세요.'});
    else{box.select();m.className='msg ok';m.textContent='아래 코드를 길게 눌러 복사하세요.'}
    return;
  }
  if(d.act==='importMerge'||d.act==='importReplace'){
    const m=document.getElementById('bk-msg');
    try{
      if(d.act==='importReplace'&&!armed2(t,'imp','한 번 더 누르면 바꿔요')) return;
      m.className='msg';m.textContent='불러오는 중…';
      let got=await importCode(document.getElementById('bk-box').value);
      if(d.act==='importMerge'){ // skip duplicates and a second "me"
        const have=state.friends;got=got.filter(p=>!have.some(f=>(p.code&&f.code===p.code)||(p.uid&&f.uid===p.uid)));
        if(meOf()) got.forEach(p=>{if(p.isMe)p.isMe=false});
      }
      state.friends=d.act==='importReplace'?got:state.friends.concat(got);
      sel=null;save();render();
      const m2=document.getElementById('bk-msg');m2.className='msg ok';m2.textContent=`${got.length}명을 불러왔어요.`;
    }catch(err){console.warn(err);m.className='msg err';m.textContent='코드를 읽지 못했어요. 코드 전체를 붙여넣었는지, 인터넷이 연결돼 있는지 확인해 주세요.'}
    return;
  }

  if(d.chip){sel.has(d.chip)?sel.delete(d.chip):sel.add(d.chip);render();return}
  if(d.toggle){editCls=null;openId=openId===d.toggle?null:d.toggle;render();return}
  if(d.parse||d.parseReplace){
    const id=d.parse||d.parseReplace, f=state.friends.find(x=>x.id===id);
    state.ui=state.ui||{};state.ui['imp-'+id]=true;if(f&&f.isMe)state.ui.mycls=true;
    const txt=document.getElementById('paste-'+id).value;
    if(/BEGIN:VCALENDAR/i.test(txt)){if(d.parseReplace)f.classes=[];importICSInto(id,txt);return}
    const got=parseTimetable(txt);
    if(!got.length){const m=document.getElementById('msg-'+id);m.className='msg err';m.textContent='수업을 하나도 찾지 못했어요. 요일과 “10:30-11:20” 같은 시간이 한 줄에 있는지 확인해 주세요.';return}
    f.classes=d.parseReplace?got:f.classes.concat(got); save(); render();
    const m=document.getElementById('msg-'+id);m.className='msg ok';m.textContent=`수업 ${got.length}개를 읽었어요.`;return;
  }
  if(d.manual){
    const id=d.manual,f=state.friends.find(x=>x.id===id),g=k=>document.getElementById(`m-${k}-${id}`).value.trim();
    const days=parseDays(g('days')),st=g('start'),en=g('end');
    const m=document.getElementById('msg-'+id);
    if(!days.length||!st||!en){m.className='msg err';m.textContent='요일, 시작, 끝 시간을 모두 입력해 주세요.';return}
    const s=parseTime(st),en2=parseTime(en);
    if(en2<=s){m.className='msg err';m.textContent='끝 시간이 시작 시간보다 늦어야 해요.';return}
    f.classes.push({id:uid(),course:g('course')||'수업',type:'',days,start:s,end:en2,loc:g('loc')});save();render();return;
  }
  if(d.delc){editCls=null;const [fid,cid]=d.delc.split(':');const f=state.friends.find(x=>x.id===fid);f.classes=f.classes.filter(c=>c.id!==cid);save();render();return}
  if(d.delf){if(!armed2(t,'del'+d.delf,'한 번 더 누르면 삭제돼요'))return;
    {const f=state.friends.find(x=>x.id===d.delf);
     if(f&&f.isMe&&f.code){const code=f.code;fbUser().then(()=>FB.db.collection('people').doc(code).delete()).catch(()=>{})}}state.friends=state.friends.filter(x=>x.id!==d.delf);sel&&sel.delete(d.delf);openId=null;save();render();watchFriends();return}
});
view.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.avatar&&t.files&&t.files[0]){
    const file=t.files[0];t.value='';const url=URL.createObjectURL(file);
    loadImg(url).then(img=>openCropper(img)).catch(()=>toast('이 사진은 열 수 없어요'));
    return;
  }
  if(t.dataset.photo&&t.files&&t.files[0]){readPhoto(t.dataset.photo,t.files[0]);t.value='';return}
  if(t.dataset.ics&&t.files&&t.files[0]){const fid=t.dataset.ics;t.files[0].text().then(txt=>importICSInto(fid,txt));t.value='';return}
  if(t.dataset.name){const f=state.friends.find(x=>x.id===t.dataset.name),v=t.value.trim().slice(0,30);if(f.isMe||!f.code)f.name=v||f.name;else f.nick=v&&v!==f.name?v:undefined;save()}
  if(t.dataset.color){const f=state.friends.find(x=>x.id===t.dataset.color);f.color=t.value;save();render()}
});
function addFriend(){
  const f={id:uid(),name:'친구 '+(others().length+1),color:PALETTE[state.friends.length%PALETTE.length],classes:[]};
  state.friends.push(f);openId=f.id;sel&&sel.add(f.id);save();render();
  const inp=document.querySelector(`[data-name="${f.id}"]`);if(inp){inp.focus();inp.select()}
}

function toggleBlk(d){
  const key=d.skip!==undefined?d.skip:d.offb,b=blkFrom(key); if(!b) return;
  if(d.skip!==undefined){const k=dateKey(b.d,b.off);b.c.skip=b.c.skip===k?undefined:k}
  else {b.c.off=!b.c.off; if(b.c.off) b.c.skip=undefined}
  save();flushPublish();render();
  const sh=document.getElementById('sheet');sh.innerHTML=sheetHTML(key);if(!sh.innerHTML)sh.hidden=true;
}
document.getElementById('sheet').addEventListener('click',e=>{
  const sh=e.currentTarget,t=e.target.closest('button');
  if(t&&t.dataset.sp!==undefined){const [e,tx]=ST_PRESETS[+t.dataset.sp];sh.querySelector('#stE').value=e;sh.querySelector('#stT').value=tx;sh.querySelectorAll('.stchip').forEach(x=>x.setAttribute('aria-pressed',x===t));return}
  if(t&&t.dataset.sd){sh.querySelectorAll('[data-sd]').forEach(x=>x.setAttribute('aria-pressed',x===t));return}
  if(t&&t.dataset.act==='stSave'){if(saveStatus(sh)!==false)sh.hidden=true;return}
  if(t&&t.dataset.act==='stClear'){const me=meOf();if(me){delete me.status;save();flushPublish();render()}sh.hidden=true;return}
  if(t&&t.dataset.act==='cropCancel'){sh.hidden=true;crop=null;return}
  if(t&&t.dataset.act==='cropSave'){const me=meOf(),d=crop&&cropResult();if(me&&d){me.photo=d;save();flushPublish();render();toast('프로필 사진을 바꿨어요')}else toast('사진을 저장하지 못했어요');sh.hidden=true;crop=null;return}
  if(e.target.id==='sheet'&&crop) return; // don't lose the crop by tapping outside
  if(e.target.id==='sheet'||(t&&t.dataset.act==='sheetClose')){sh.hidden=true;return}
  if(t&&(t.dataset.skip!==undefined||t.dataset.offb!==undefined)) toggleBlk(t.dataset);
});
load(); render(); checkHash(); startSync(); netBadge();
window.addEventListener('hashchange',()=>checkHash());
setInterval(()=>{if(live&&tab!=='manage'&&tab!=='me'&&!typing())render()},30000);
</script>
</body>
